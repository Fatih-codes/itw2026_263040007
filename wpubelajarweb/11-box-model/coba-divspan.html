<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Div & Span</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .kotak {
            background-color: #f0f0f0;
            border: 2px solid gray;
            width: 600px;
            padding: 40px;
        }

        .highlight {
            background-color: rgb(255, 181, 181);
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Perbedan di dan span </h1>
    <div class="kotak">
        <h2>Ini adalah judul artikel</h2>
        <p>
            Div adalah elemen <strong>block</strong>. Lihat bagaimana kotak abu abu  ini membungkus seluruh konten artikel. Di dalam parafraf ini, kita akan menggunakan span untuk memberi <span class="highlight">style</span> pada kata kata tertentu.
        </p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Backgroun</title>
    <style>
        body {
            min-height: 100vh;
            font-family: Arial;
            background-color: grey;
        }

        .frame {
            width: 400px;
            height: 400px;
            border: 10px solid white;
            margin: auto;
            background-image: url(img/r.png),url(img/b6f0a715d48f24e180d2f44a574e5aad-removebg-preview.png), url(img/h.png);
            background-size: 320px, 400px, 400px;
            background-repeat: no-repeat, no-repeat, no-repeat;
            background-position: center bottom, center 70%, bottom left;
            background-color: white;
            border-radius: 50%;
        }

        h1 {
            color: white;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 40px;
            text-shadow: 2px 2px 4px black;
        }
    </style>
</head>
<body>
    <h1>My profile card</h1>
    <div class="frame"></div>
</body>
</html>

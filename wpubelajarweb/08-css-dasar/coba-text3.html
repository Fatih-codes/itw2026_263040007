<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coba text text overlow & text shadow</title>

    <style>
        p {
            font-size: 26px;
            white-space: nowrap;
            width: 300px;
            background-color: lightblue;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        h1 {
            font-size: 100px;
            text-align: center;
            font-family: Arial;
            text-shadow: 5px 5px 0 grey;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: lightblue;
            text-decoration-skip-ink: none;
        }
    </style>
</head>
<body>
    <h1>Hello css</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Sint dolor fuga accusantium ratione provident esse ipsa maiores quae, accusamus hic impedit omnis debitis exercitationem pariatur repellendus illo eos sapiente culpa?</p>
</body>
</html>

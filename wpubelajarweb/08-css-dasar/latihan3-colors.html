<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qoute</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Playwrite+IT+Trad:wght@100..400&family=Press+Start+2P&family=Redaction:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            background-color: #f0e68c;
            color: rgb(240, 248, 255);
        }
        
        h1 {
            font-family: "Playwrite IT Trad", cursive;
            text-align: center;
            text-decoration: underline;
            font-size: 75px;
            letter-spacing: 10px;
            font-style: italic;
            text-shadow: 3px 3px 0 red;
        }
        
        .kata-kata {
            text-align: center;
            font-family: "Playwrite IT Trad", cursive;
            font-size: 25px;
            letter-spacing: 10px;
            text-shadow: 1px 0 0 rgb(255, 0, 0);
            border: 10px;
            
        }

        .creadit {
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            font-size: 20px;
        }

    </style>
</head>
<body>
    <h1>Dua Orang Asing</h1>
    <p class="kata-kata">"Kita pernah menjadi rumah bagi satu sama lain, <br>berbagi cerita, tawa, dan segala hal sederhana. ,<br>Namun, waktu mengubah segalanya. <del> Kini </del>, kita hanya dua orang asing yang menyimpan <br>kenangan sama, tetapi berjalan menuju arah yang berbeda."</p>
    <br>
    <p class="creadit">- Anonymous -</p>

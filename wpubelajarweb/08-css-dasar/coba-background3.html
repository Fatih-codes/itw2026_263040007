<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coba background</title>
    <style>
        body {
            background-color: lightblue;
            background-image: linear-gradient(to right, lightgreen, lightyellow);
            height: 100vb;
        }

        .kotak1 {
            width: 300px;
            height: 300px;
            background-color: red;
            background-image: linear-gradient(to bottom,lightblue,lightyellow);
        }

        .kotak2 {
            width: 300px;
            height: 300px;
            background-color: red;
            background-image: radial-gradient(red,blue);
        }
        .kotak3 {
            width: 300px;
            height: 300px;
            background-color: red;
            background-image: conic-gradient(green,red,blue);
        }
    </style>
</head>
<body>
    <br>
    <div class="kotak1">
        <br>
    <div class="kotak2">
        <br>
    <div class="kotak3">
        </div>
        </div>
    </div>
</body>
</html>

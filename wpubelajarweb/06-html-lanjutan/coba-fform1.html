<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Contohcontoh elemen fotrm</h1>

    <form>
    <label for="nama">Nama
        <input type="name" name="nama" id="nama" placeholder="Masukan Nama">
    </label>

    <br>

    <label for="email">Email
        <input type="email" name="email" id="email" placeholder="Masukan Email">
    </label>

    <br>

    <label for="number">No. Telpon
        <input type="number" name="number" id="number" placeholder="Masukan No. Telpon" min="0">
    </label>
    <br>

    <label for="password">Password
        <input type="password" name="password" id="password" placeholder="Masukan Password">
    </label>

    <br>

    <label for="date">TTL
        <input type="date" name="date" id="date">
    </label>

    <br>

    <label for="color">Pilih Warna
        <input type="color" name="color" id="color">
    </label>
    <br>

    <button type="submit" >Kirim</button>
    </form>
</body>
</html>

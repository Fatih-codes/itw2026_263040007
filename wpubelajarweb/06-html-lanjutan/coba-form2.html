<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contoh input atribut checkbox & radio</title>
</head>
<body>
    <h1>contoh input atribut checkbox & radio</h1>

    <form>
    <label for="nama">Nama
        <input type="name" name="nama" id="nama" placeholder="Masukan Nama" autofocus autocomplete="off" required>
    </label>

    <br>
    <h3>Hobby</h3>
    <label for="hobby1">
        <input type="checkbox" name="hobby1" id="hobby1" value="olahraga" checked>
        Olahraga
    </label>

    <br>

    <label for="hobby2">
        <input type="checkbox" name="hobby2" id="hobby2" value="ngoding">
        ngoding
    </label>

    <br>

    <h3>Jenis Kelamin</h3>
    <label for="pria">
        <input type="radio" name="jk" id="pria" value="pria" checked>
        Pria
    </label>
    <br>

    <label for="wanita">
        <input type="radio" name="jk" id="wanita" value="wanita">
        Wanita
    </label>
    <br>
    <button type="submit" >Kirim</button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba elemen form fidalam tabel</title>
</head>
<body>
    <h1>Contoh elemen fotrm pada HTML</h1>

    <form>
        <table cellpadding="5">
            <tr>
                <td align="right"><label for="nama">Nama</label></td>
                <td><input type="name" name="nama" id="nama" placeholder="Masukan Nama"></td>
            </tr>
            <tr>
                <td align="right"><label for="email">Email</label></td>
                <td><input type="email" name="email" id="email" placeholder="Masukan Email"></td>
            </tr>
            <tr>
                <td align="right"><label for="number">No. Telpon</label></td>
                <td> <input type="number" name="number" id="number" placeholder="Masukan No. Telpon" min="0"></td>
            </tr>
            <tr>
                <td align="right"> <label for="password">Password</label></td>
                <td><input type="password" name="password" id="password" placeholder="Masukan Password"></td>
            </tr>
            <tr>
                <td align="right"><label for="date">TTL </label></td>
                <td><input type="date" name="date" id="date"></td>
            </tr>
            <tr>
                <td align="right"><label for="color">Pilih Warna</label></td>
                <td><input type="color" name="color" id="color"></td>
            </tr>
            <tr>
                <td><button type="submit" >Kirim</button></td>
            </tr>   
    </table>
    </form>
</body>
</html>
